# Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Compose Multiplatform
org.jetbrains.compose.experimental.uikit.enabled=true

# Suppress compileSdk warning
android.suppressUnsupportedCompileSdk=35

# Fix for duplicate class issues between kotlin-stdlib versions
android.enableJetifier=false

# Non-transitive R classes (recommended for modern Android)
android.nonTransitiveRClass=true
