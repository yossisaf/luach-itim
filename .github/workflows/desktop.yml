name: Build Desktop EXE/MSI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    # jpackage (used by packageExe/packageMsi) must run on Windows to
    # produce a Windows installer - unlike the Android APK job, this
    # cannot run on ubuntu-latest.
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pin version to 0.9.58
        run: |
          "versionMajor=0" | Out-File -Encoding ASCII version.properties
          "versionMinor=9" | Add-Content -Encoding ASCII version.properties
          "versionPatch=57" | Add-Content -Encoding ASCII version.properties
        shell: pwsh

      - name: Build EXE installer
        run: gradle :composeApp:packageExe --stacktrace

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: luach-itim-desktop-exe
          path: composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
